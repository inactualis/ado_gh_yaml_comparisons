parameters:
  - name: azureServiceConnection
    type: string
    default: sc-azure-dev

  - name: appName
    type: string
    default: someapp-web-dev-01

  - name: packagePath
    type: string
    default: '$(Pipeline.Workspace)/drop/app.zip'

  - name: deploymentMethod
    type: string
    default: zipDeploy

steps:
  - task: AzureWebApp@1
    displayName: Deploy package to ${{ parameters.appName }}
    inputs:
      azureSubscription: ${{ parameters.azureServiceConnection }}
      appName: ${{ parameters.appName }}
      package: ${{ parameters.packagePath }}
      deploymentMethod: ${{ parameters.deploymentMethod }}